name: Build ZRAM PSI Recompress Module

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync version from source to module.prop
        run: |
          set -e
          # 从 psi_recomp.c 头部注释提取版本号
          VERSION=$(grep -oP 'v\d+\.\d+\.\d+' src/psi_recomp.c | head -1)
          if [ -n "$VERSION" ]; then
            echo "Detected version: $VERSION"
            sed -i "s/version=.*/version=$VERSION/" module/module.prop
            # versionCode: v1.2.3 -> 10203
            VCODE=$(echo "$VERSION" | sed 's/v//' | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
            sed -i "s/versionCode=.*/versionCode=$VCODE/" module/module.prop
            echo "Updated module.prop:"
            cat module/module.prop
          else
            echo "No version found in source, keeping existing module.prop"
          fi

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Build arm64 binary
        run: |
          set -e
          NDK="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64"
          # API 31(Android 12)；不用 -static，原因见下
          CC="$NDK/bin/aarch64-linux-android31-clang"
          $CC --version | head -1
          mkdir -p build
          # 不使用 -static：NDK 静态二进制在 Android 15/16 上会被 linker 拒绝
          #   "executable's TLS segment is underaligned: alignment is 8, needs at least 64"
          # 改为动态 PIE 链接（仅依赖 Bionic libc，late_start 阶段 /system 已挂载）
          # 同时按 16KB 对齐以兼容 16KB page size 内核（4KB 设备上同样安全）
          $CC -O2 -fPIE -pie -Wall -Wextra -Wshadow \
              -Wl,-z,max-page-size=65536 \
              -Wl,-z,common-page-size=65536 \
              -o build/psi_recomp src/psi_recomp.c
          chmod 0755 build/psi_recomp
          echo "--- 依赖动态库 ---"
          "$NDK/bin/llvm-readelf" -d build/psi_recomp | grep -E "NEEDED|soname" || true
          ls -la build/

      - name: Verify TLS alignment
        run: |
          set -e
          NDK="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64"
          echo "--- Program Headers (关注 TLS 段 Align) ---"
          "$NDK/bin/llvm-readelf" -l build/psi_recomp
          ALIGN=$("$NDK/bin/llvm-readelf" -l build/psi_recomp | awk '/TLS/{print $NF; exit}')
          echo "TLS align = $ALIGN"
          if [ -n "$ALIGN" ] && [ "$ALIGN" -lt 64 ]; then
            echo "❌ TLS alignment < 64，Android 15/16 会拒绝执行"
            exit 1
          fi
          echo "✅ TLS 对齐检查通过"

      - name: Assemble Magisk module
        run: |
          set -e
          rm -rf stage && mkdir -p stage
          cp -r module/* stage/
          cp build/psi_recomp stage/psi_recomp
          # webroot 已包含在 module/* 中，确保权限正确
          chmod 0755 stage/psi_recomp stage/service.sh
          find stage -type f | sort
          echo "--- module size ---"
          du -sh stage

      - name: Package
        run: |
          set -e
          cd stage
          zip -r ../psi-recompress-module.zip . -x ".*"
          cd ..
          ls -la psi-recompress-module.zip
          echo "--- 校验：模块 zip 顶层条目 ---"
          unzip -Z1 psi-recompress-module.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: psi-recompress-module
          path: psi-recompress-module.zip

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: psi-recompress-module.zip
          make_latest: true
