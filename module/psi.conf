# psi_recomp 守护进程配置文件
# 此文件中的所有参数均为可选，缺失时使用编译默认值
# 修改后重启模块生效（ Magisk: 重启手机 或 在 Magisk App 中重新启用模块 ）

# 常态触发阈值（huge 页数）
# 当 huge 页数超过此值时触发重压缩
THRESH_NORMAL=40000

# 滞回持续时间（秒）
# 刚压完后的这段时间内，阈值会提高到「上次残留 + HYST_MARGIN」
# 避免在残留区反复空压
HYSTERESIS_SEC=5400

# 滞回余量（页数）
# 滞回期间阈值 = 上次压缩后的残留 + 此值
HYST_MARGIN=8000

# 两次检查的最小间隔（秒）
# 防止 PSI 高频触发导致检查过于频繁
MIN_GAP_SEC=60

# 兜底轮询间隔（毫秒）
# PSI 无事件时最多等待这么久再检查一次
IDLE_TIMEOUT_MS=1800000

# PSI 触发条件
# 格式: <some|full> <stall_us> <window_us>
# 含义: 在 window_us 微秒的窗口内，stall 时间超过 stall_us 微秒则触发
# 当前值 = 1 秒窗口内 stall > 15ms
PSI_TRIGGER=some 15000 1000000

# 日志轮转：超过 LOG_MAX_LINES 行时保留最后 LOG_KEEP_LINES 行
LOG_MAX_LINES=600
LOG_KEEP_LINES=300

# 连续 skip 时每 N 次记录一行日志（降低日志噪音）
SKIP_LOG_EVERY=5
