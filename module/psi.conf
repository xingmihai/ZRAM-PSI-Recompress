# psi_recomp 守护进程配置文件
# 此文件中的所有参数均为可选，缺失时使用编译默认值
# 修改后重启模块生效（ Magisk: 重启手机 或 在 Magisk App 中重新启用模块 ）

# 常态触发阈值（huge 页数）
# 当 huge 页数超过此值时触发重压缩
THRESH_NORMAL=40000

# 强制压缩最小间隔（秒）
# v1.3.6 起滞回不再有时间窗：阈值 = 上次压缩后的残留 + HYST_MARGIN，一直生效到下次压缩。
# 本项现在只用于「绝对上限兜底」：huge 超过 THRESH_NORMAL×1.5 时无视滞回强制压一次，
# 但距上次压缩至少间隔这么久，避免地板本身就很高时反复空压。
HYSTERESIS_SEC=5400

# 滞回余量（页数）
# 阈值 = 上次压缩后的残留 + 此值（一直生效到下次压缩）
HYST_MARGIN=8000

# 两次检查的最小间隔（秒）
# 防止 PSI 高频触发导致检查过于频繁
MIN_GAP_SEC=60

# 兜底轮询间隔（毫秒）
# PSI 无事件时最多等待这么久再检查一次
IDLE_TIMEOUT_MS=1800000

# PSI 触发条件
# 格式: <some|full> <stall_us> <window_us>
# 含义: 在 window_us 微秒的窗口内，stall 时间超过 stall_us 微秒则触发
# 当前值 = 1 秒窗口内 stall > 15ms
PSI_TRIGGER=some 15000 1000000

# 日志轮转：超过 LOG_MAX_LINES 行时保留最后 LOG_KEEP_LINES 行
LOG_MAX_LINES=600
LOG_KEEP_LINES=300

# 连续 skip 时每 N 次记录一行日志（降低日志噪音）
SKIP_LOG_EVERY=5

# 重压缩分批：单次 sysfs write 最多尝试的页数（需内核支持 max_pages=）
# 0 = 关闭（默认），保持旧行为：一次全量扫描。
# 注意：max_pages 只限制「尝试重压缩的页数」，不限制全 slot 扫描范围。
# 12 GiB 设备每批仍要遍历 3,145,728 个 slot，多批会成倍放大 CPU 开销，
# 所以默认关闭。仅在 ENOMEM 频繁、且确认分批有效时才建议开启。
# 守护启动时会零副作用探测能力（最多处理 1 页），日志写明 supported yes/no。
# 开启后一次检查内最多连续 RECOMP_BATCH_MAX 批，用最终 huge 作为滞回基准，
# 语义与全量扫描一致，不会把门槛越抬越高。
RECOMP_BATCH_PAGES=0
RECOMP_BATCH_MAX=2
